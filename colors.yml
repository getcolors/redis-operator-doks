# Desired state for the redis-operator-doks deployment: the Redis operator
# installed in the doks-dev cluster (sibling deployment), managing one Redis
# Droplet in ams3 whose compute state lives in the redis-state bucket and
# whose RDB backup sets go to the redis-backup bucket. Non-secret values only;
# the five COLORS_PAR_* credentials live in the gitignored .envrc.private.
# Never export COLORS_PAR_PROFILE.
profile: redis-operator-doks
workdir: .colors
kube-context: do-ams3-doks-dev
namespace: colors-redis
image: registry.digitalocean.com/doks-dev/redis-operator-red@sha256:8d53eb6932dddc3e9b512545ae02f7123f54acbc0d0d3346d7bd8331c21f3d8c
image-pull-secret: doks-dev
reconcile-interval: 30s
deletion-policy: Retain
compute-prevent-destroy: true
doks-cluster-id: be709b80-df9d-4bf0-8d6b-5333c650d9a6
provider-compute: digitalocean
provider-backend: r2
redis-image: docker.io/library/redis:7.2.16@sha256:74566c6910d13ae61e7ce73ebd3127438a1fe805b309b097c323142719ec8a5b
redis-port: 6379
redis-backup-r2-bucket: redis-backup
redis-backup-r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
redis-backup-r2-region: auto
redis-backup-oncalendar: "*-*-* 00/6:00:00"
redis-backup-retention-days: 7
redis-backup-max-age-hours: 8
digitalocean-region: ams3
digitalocean-size: s-1vcpu-2gb
digitalocean-image: ubuntu-24-04-x64
# The DOKS worker (the controller's egress) and the developer workstation.
digitalocean-ssh-sources: [159.223.1.98/32, 89.168.97.254/32]
r2-bucket: redis-state
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
